# One Render web service runs the API, Socket.IO and the built React app.
services:
  - type: web
    name: playhive
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: CLIENT_DIST
        value: ../client/dist
      - key: MONGODB_URI
        sync: false
